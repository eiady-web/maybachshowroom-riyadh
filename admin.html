<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Maybach Showroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gray-900">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Admin Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input type="text" id="username" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div id="loginError" class="text-red-500 text-sm mb-4 hidden">Invalid credentials.</div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="bg-gray-900 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Showroom Dashboard</h1>
            <div class="flex items-center gap-4">
                <a href="index.html" target="_blank" class="text-gray-300 hover:text-white transition">View Site</a>
                <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold transition">Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-800">Inventory Management</h2>
                    <div class="flex gap-2">
                        <button onclick="seedData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow transition flex items-center gap-2">
                            Seed Data
                        </button>
                        <button onclick="openModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add Vehicle
                        </button>
                    </div>
                </div>

                <!-- Cars Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b">
                                <th class="p-4 font-semibold text-gray-600">ID</th>
                                <th class="p-4 font-semibold text-gray-600">Image</th>
                                <th class="p-4 font-semibold text-gray-600">Brand</th>
                                <th class="p-4 font-semibold text-gray-600">Name</th>
                                <th class="p-4 font-semibold text-gray-600">Price</th>
                                <th class="p-4 font-semibold text-gray-600 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="carsTableBody" class="divide-y divide-gray-200">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="carModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Add New Vehicle</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="carForm" onsubmit="handleCarSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="carId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Brand Code (e.g., maybach, rollsroyce, bentley)</label>
                        <input type="text" id="brand" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Short Name</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="fullName" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                        <input type="number" id="year" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mileage</label>
                        <input type="text" id="mileage" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Engine</label>
                        <input type="text" id="engine" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Power</label>
                        <input type="text" id="power" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Transmission</label>
                        <input type="text" id="transmission" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Condition</label>
                        <input type="text" id="condition" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price (Number)</label>
                        <input type="number" id="price" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price Display (e.g. SAR 1,250,000)</label>
                        <input type="text" id="priceDisplay" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Main Image URL</label>
                        <input type="url" id="image" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gallery URLs (one per line)</label>
                        <textarea id="gallery" rows="3" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="description" rows="4" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Save Vehicle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyC32JMbIcpJFbsBS0Be2N07N2L1yPsedrM",
            authDomain: "maybach-showroom.firebaseapp.com",
            projectId: "maybach-showroom",
            storageBucket: "maybach-showroom.firebasestorage.app",
            messagingSenderId: "294431399310",
            appId: "1:294431399310:web:3fb150dd4a0ec8cc6198df",
            measurementId: "G-DQLZ46MLB8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let token = localStorage.getItem('adminToken');
        let carsData = [];

        // Simple auth simulation for the dashboard UI state (Actual auth should be Firebase Auth in production)
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'admin123';

        // App Initialization
        if (token === 'valid-admin-token') {
            showDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                token = 'valid-admin-token';
                localStorage.setItem('adminToken', token);
                document.getElementById('loginError').classList.add('hidden');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('adminToken');
            token = null;
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            fetchCars();
        }

        async function fetchCars() {
            try {
                const snapshot = await db.collection('cars').get();
                carsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTable();
            } catch (err) {
                console.error("Error fetching cars from Firestore:", err);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('carsTableBody');
            tbody.innerHTML = '';
            carsData.forEach(car => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-4 text-gray-500 text-xs">...${car.id.slice(-5)}</td>
                    <td class="p-4"><img src="${car.image}" alt="${car.name}" class="w-16 h-10 object-cover rounded shadow-sm"></td>
                    <td class="p-4 capitalize">${car.brand}</td>
                    <td class="p-4 font-medium">${car.fullName}</td>
                    <td class="p-4 text-green-600 font-medium">${car.priceDisplay}</td>
                    <td class="p-4 text-right">
                        <button onclick="editCar('${car.id}')" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                        <button onclick="deleteCar('${car.id}')" class="text-red-600 hover:text-red-800">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(car = null) {
            document.getElementById('carModal').classList.remove('hidden');
            const form = document.getElementById('carForm');
            if (car) {
                document.getElementById('modalTitle').textContent = 'Edit Vehicle';
                document.getElementById('carId').value = car.id;
                document.getElementById('brand').value = car.brand;
                document.getElementById('name').value = car.name;
                document.getElementById('fullName').value = car.fullName;
                document.getElementById('year').value = car.year;
                document.getElementById('mileage').value = car.mileage;
                document.getElementById('engine').value = car.engine;
                document.getElementById('power').value = car.power;
                document.getElementById('transmission').value = car.transmission;
                document.getElementById('condition').value = car.condition;
                document.getElementById('price').value = car.price;
                document.getElementById('priceDisplay').value = car.priceDisplay;
                document.getElementById('image').value = car.image;
                document.getElementById('gallery').value = car.gallery.join('\n');
                document.getElementById('description').value = car.description;
            } else {
                document.getElementById('modalTitle').textContent = 'Add New Vehicle';
                form.reset();
                document.getElementById('carId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('carModal').classList.add('hidden');
        }

        function editCar(id) {
            const car = carsData.find(c => c.id === id);
            if (car) openModal(car);
        }

        async function deleteCar(id) {
            if (!confirm('Are you sure you want to delete this vehicle?')) return;
            try {
                await db.collection('cars').doc(id).delete();
                fetchCars();
            } catch (err) {
                console.error("Error deleting car:", err);
            }
        }

        async function handleCarSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('carId').value;
            const galleryText = document.getElementById('gallery').value;
            const gallery = galleryText.split('\n').map(s => s.trim()).filter(s => s);

            const payload = {
                brand: document.getElementById('brand').value,
                name: document.getElementById('name').value,
                fullName: document.getElementById('fullName').value,
                year: parseInt(document.getElementById('year').value),
                mileage: document.getElementById('mileage').value,
                engine: document.getElementById('engine').value,
                power: document.getElementById('power').value,
                transmission: document.getElementById('transmission').value,
                condition: document.getElementById('condition').value,
                price: parseFloat(document.getElementById('price').value),
                priceDisplay: document.getElementById('priceDisplay').value,
                image: document.getElementById('image').value,
                gallery: gallery,
                description: document.getElementById('description').value
            };

            try {
                if (id) {
                    await db.collection('cars').doc(id).update(payload);
                } else {
                    await db.collection('cars').add(payload);
                }
                
                closeModal();
                fetchCars();
            } catch (err) {
                console.error("Error saving vehicle:", err);
                alert('Error saving vehicle');
            }
        }

            try {
                for (const car of initialCars) {

    </script>
</body>
</html>
